services:
  sector-api:
    build: .
    image: beacon-sector-api:latest
    container_name: beacon-sector-api
    ports:
      # 宿主机端口:容器端口；可用环境变量 SECTOR_API_PORT 覆盖宿主机端口
      - "${SECTOR_API_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
